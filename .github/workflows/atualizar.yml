name: Atualizar Loterias Caixa
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Resultados Oficiais
        run: |
          python3 -c "
          import urllib.request, json, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          jogos = ('megasena','lotofacil','quina','lotomania','maismilionaria','timemania','duplasena','diadesorte','supersete','federal')
          db = dict()
          for j in jogos:
              try:
                  url = 'https://' + 'raw.githubusercontent.com'+ / + 'guilhermeasn/loteria.json/' + 'master/data/' + j + '.json'

                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  raw = json.loads(urllib.request.urlopen(req, context=ctx, timeout=15).read().decode('utf-8'))
                  chaves = sorted(map(int, raw.keys()), reverse=True)
                  ult = next(iter(chaves))
                  hist = list()
                  for c in list(chaves)[:50]:
                      hist.append(list(map(lambda x: str(x).zfill(2), raw.get(str(c)))))
                  db.update({j: {
                      'numero': ult,
                      'listaDezenas': next(iter(hist)),
                      'historico': hist,
                      'dataApuracao': 'Oficial Caixa',
                      'dataProximoConcurso': 'Próximo Sorteio',
                      'valorEstimadoProximoConcurso': 0,
                      'listaMunicipioUFGanhadores': list()
                  }})
              except Exception as e:
                  print(j, e)
          with open('dados_caixa.json', 'w', encoding='utf-8') as f:
              json.dump(db, f, ensure_ascii=False)
          "
      - name: Salvar no Repositorio
        run: |
          git config user.name "Robo Loterias"
          git config user.email "robo@github.com"
          git add dados_caixa.json
          git commit -m "Atualiza sorteios Caixa" || exit 0
          git push
          
